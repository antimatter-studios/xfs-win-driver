version: "3"
chore_min_version: 0.6.0

# EVERY DEPENDENCY IS A SIBLING HERE, INCLUDING THE THIRD-PARTY FORK.
#
# This differs from erofs-win-driver and ext4-win-driver, which keep
# vendor/winfsp-rs as a git submodule, and the difference is worth
# stating rather than leaving as an accident of how this repo was
# created.
#
# The argument for a submodule is that winfsp-rs is our fork of someone
# else's crate, carrying a patch that is not ours to release, and that
# no other repo wants that revision. The second half stopped being true:
# both existing drivers now pin the SAME revision, because upstream
# 0.13.0 does not compile for *-pc-windows-gnullvm. Once every consumer
# wants one revision, a per-consumer pin is exactly the drift a sibling
# checkout makes unrepresentable.
#
# So this repo takes the simpler shape, and if it holds, the other two
# should follow rather than this one being bent back to match them.
#
# The manifest already depends on `../winfsp-rs/winfsp`, so the sibling
# layout is not a change here -- it is what this tree was written
# against.

vars:
  # URL beside ref for each: a URL rebuilt from a repo name is wrong the
  # moment a repository moves, and git answers a repo it cannot see with a
  # credential prompt rather than a 404, so it fails as an auth error.
  FS_CORE_URL: https://github.com/antimatter-studios/rust-fs-core.git
  FS_CORE_REF: v0.3.8
  FS_XFS_URL: https://github.com/antimatter-studios/rust-fs-xfs.git
  FS_XFS_REF: v0.12.1
  SKELETON_URL: https://github.com/antimatter-studios/winfsp-fs-skeleton.git
  SKELETON_REF: v0.2.2
  # fs-windows-test-harness, which fs-test-harness became at v4.0.0: the
  # matrix runs through it, in CI as on a developer's Windows VM (#7).
  HARNESS_URL: https://github.com/antimatter-studios/fs-windows-test-harness.git
  HARNESS_REF: v4.3.1
  # Pinned to a commit, not a branch: this is the revision both other
  # drivers build against. Upstream 0.13.0 declares the guard-strategy
  # constant signed while bindgen emits it unsigned for the gnullvm
  # target, so it does not compile there.
  WINFSP_RS_URL: https://github.com/antimatter-studios/winfsp-rs.git
  WINFSP_RS_REF: 59ab48bca2a67c95d4eba640343b6b80b87bb6ea

tasks:
  siblings:
    desc: Check out the sibling repos this crate builds against, at their pinned refs
    # Refuses to move a sibling with uncommitted work: a checkout is
    # destructive, and a task that also runs in CI must not eat
    # someone's afternoon when they run it locally.
    cmds:
      - |
        set -eu
        printf '%s\t%s\t%s\n' \
          rust-fs-core       '{{.FS_CORE_URL}}'   '{{.FS_CORE_REF}}' \
          rust-fs-xfs        '{{.FS_XFS_URL}}'    '{{.FS_XFS_REF}}' \
          winfsp-fs-skeleton '{{.SKELETON_URL}}'  '{{.SKELETON_REF}}' \
          fs-windows-test-harness '{{.HARNESS_URL}}' '{{.HARNESS_REF}}' \
          winfsp-rs          '{{.WINFSP_RS_URL}}' '{{.WINFSP_RS_REF}}' \
        | while IFS="$(printf '\t')" read -r name url ref; do
            dir="../$name"
            if [ ! -d "$dir/.git" ]; then
              echo "siblings: cloning $name at $ref"
              git clone --quiet "$url" "$dir"
              git -C "$dir" checkout --quiet "$ref"
              continue
            fi
            if [ -n "$(git -C "$dir" status --porcelain)" ]; then
              echo "siblings: $name has uncommitted changes -- refusing to move it." >&2
              exit 1
            fi
            git -C "$dir" fetch --quiet --tags origin
            if [ "$(git -C "$dir" rev-parse HEAD)" = "$(git -C "$dir" rev-parse "$ref^{commit}")" ]; then
              echo "siblings: $name already at $ref"
              continue
            fi
            echo "siblings: moving $name to $ref"
            git -C "$dir" checkout --quiet "$ref"
          done

  check:
    desc: Type-check the parts that build off Windows
    cmds:
      - cargo check --locked --no-default-features
