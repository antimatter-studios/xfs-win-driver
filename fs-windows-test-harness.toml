# fs-windows-test-harness.toml — fs-windows-test-harness consumer config
# for xfs-win-driver (#7).
#
# The harness scripts + Rust runner live at ../fs-windows-test-harness/,
# a sibling checkout of
# https://github.com/antimatter-studios/fs-windows-test-harness at the
# HARNESS_REF pinned in chores.yml. Run `chore siblings` after cloning.
#
# The images are the ones scripts/build-fixtures.sh makes on Linux:
# mkfs.xfs, then the kernel populates them. A Windows runner cannot, so CI
# builds them on ubuntu-latest and hands them over (XFS_PREBUILT_IMAGES).

[runner]
# WinFsp mounts are serialised: the WinFsp host object is a per-process
# singleton.
max_parallel = 1

[project]
name        = "xfs-win-driver"
binary      = "target/release/xfs.exe"
matrix_path = "test-matrix.json"

[vm]
# Machine-local values live in the gitignored `.test-env`, not here; see
# ../fs-windows-test-harness/scripts/setup-local.sh.
host           = "${VM_HOST}"
ssh_key        = "${SSH_KEY}"
workdir        = "${VM_WORKDIR}"
image_dir      = "${HOST_IMAGE_DIR:-diskimages}"
rust_toolchain = "stable-aarch64-pc-windows-gnullvm"
packages = [
    "MartinStorsjo.LLVM-MinGW.UCRT",
    "LLVM.LLVM",
    { id = "WinFsp.WinFsp", custom_args = "ADDLOCAL=F.Core,F.Developer" },
]
env_prefix = "$env:LIBCLANG_PATH = 'C:\\Program Files\\LLVM\\bin';"

[run]
image_dir = "${HOST_IMAGE_DIR:-diskimages}"
vm_build_command = "cargo build --release --features mount"

# ── Image ────────────────────────────────────────────────────────────────

[ops.build-xfs-image]
# A fresh copy of the scenario's image in {image_dir}/{run_id}/, from the
# images scripts/build-fixtures.sh built (XFS_PREBUILT_IMAGES).
host = "host"
command = "bash scripts/build-xfs-image.sh {run_id} {scenario.image}"
expect_exit = 0

# ── Host-side verifiers (harness-shipped, filesystem-agnostic) ──────────

[ops.verify-info]
host = "host"
command = "bash ../fs-windows-test-harness/scripts/host/verify-info.sh --binary {binary} {image_dir}/{run_id}/{scenario.image} {step.expect_args}"
expect_exit = 0

[ops.verify-ls]
# MSYS_NO_PATHCONV: Git Bash would rewrite the in-image path "/dir" into
# "C:/Program Files/Git/dir" before xfs.exe saw it.
host = "host"
command = "env MSYS_NO_PATHCONV=1 bash ../fs-windows-test-harness/scripts/host/verify-ls.sh --binary {binary} {image_dir}/{run_id}/{scenario.image} {step.path} {step.expect_args}"
expect_exit = 0

[ops.verify-cat]
host = "host"
command = "env MSYS_NO_PATHCONV=1 bash ../fs-windows-test-harness/scripts/host/verify-cat.sh --binary {binary} {image_dir}/{run_id}/{scenario.image} {step.path} {step.expect_args}"
expect_exit = 0

# ── Through a WinFsp mount (each op mounts, reads, unmounts) ─────────────

[ops.win-ls-via-mount]
host = "vm"
command = "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '{vm.harness_root}/scripts/vm/win-ls-via-mount.ps1' -BinaryCmd '{vm.workdir}/target/release/xfs.exe mount {vm.workdir}/{scenario.image} --drive {step.drive}: {step.rw_flag?} {step.extra?}' -ReadyLine 'xfs mounted at' -Drive '{step.drive}' -Path '{step.path}' -ExpectNames '{step.expect_names_csv?}' -ExpectCount '{step.expect_count?}'"
expect_exit = 0

[ops.win-cat-via-mount]
host = "vm"
command = "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '{vm.harness_root}/scripts/vm/win-cat-via-mount.ps1' -BinaryCmd '{vm.workdir}/target/release/xfs.exe mount {vm.workdir}/{scenario.image} --drive {step.drive}: {step.rw_flag?} {step.extra?}' -ReadyLine 'xfs mounted at' -Drive '{step.drive}' -Path '{step.path}' -ExpectContent '{step.expect_content?}' -ExpectSize '{step.expect_size?}' -ExpectSha256 '{step.expect_sha256?}'"
expect_exit = 0

[mount]
command    = "{binary} mount {image} --drive {drive} {extra}"
ready_line = "xfs mounted at"
