# harness.toml — fs-test-harness consumer config for xfs-win-driver.
#
# The harness scripts + Rust runner live at ./vendor/fs-test-harness/,
# vendored as a git submodule from
# https://github.com/antimatter-studios/fs-test-harness. Run
# `git submodule update --init --recursive` after cloning.
#
# XFS is a read-only filesystem natively, so the matrix is host-side
# RO probes (verify-ls/cat/info) plus vm-side RO mount + readback. RW
# scenarios via the optional `overlay-sidecar` feature are deferred —
# they need their own op shape (sidecar emit + replay) not covered here.

[project]
name        = "xfs-win-driver"
binary      = "target/release/xfs.exe"
matrix_path = "test-matrix.json"

[vm]
# Per-machine values (host / ssh_key / workdir / image_dir) come from
# the contributor's .test-env (gitignored), not this committed file.
# run-tests.sh sources .test-env, exports VM_HOST / VM_WORKDIR /
# SSH_KEY / VM_IMAGE_DIR, and the runner's per-step ssh + scp prefer
# those env vars over anything declared here. First-run bootstrap
# prompts for them when .test-env is missing.
#
# The fields below are left empty (rather than hard-coded to the
# maintainer's setup) so that no committed value masquerades as a
# working default for other contributors.
host           = ""
ssh_key        = ""
workdir        = ""
image_dir      = ""
rust_toolchain = "stable-aarch64-pc-windows-gnullvm"
# winfsp + LLVM-MinGW + LLVM (libclang) are prerequisites. WinFsp's
# default winget install ships the runtime only; bindgen also needs
# the dev pack (headers + .lib) so we declare F.Developer via custom_args.
packages = [
    "MartinStorsjo.LLVM-MinGW.UCRT",
    "LLVM.LLVM",
    { id = "WinFsp.WinFsp", custom_args = "ADDLOCAL=F.Main,F.User,F.Developer" },
]
# bindgen needs libclang to parse winfsp.h.
env_prefix = "$env:LIBCLANG_PATH = 'C:\\Program Files\\LLVM\\bin';"

[run]
# Host-side image dir for v2-mode (Mac-orchestrator) op-defs. Test
# images are produced by `fixtures/build-test-disks.sh` which invokes
# vendor/rust-fs-xfs's mkfs_xfs over a synthesised source tree —
# they're build artefacts, not tracked in git, so the vendored
# vendor/rust-fs-xfs/test-disks/ is empty until the script runs.
# Pointing here lets v2 ops resolve `{image_dir}/{scenario.image}` to
# the real images without the user setting HARNESS_IMAGE_DIR each run.
image_dir = "../rust-fs-xfs/test-disks"

# When run-tests.sh's ship phase runs (any vm-side recipe step in the
# matched scenarios), it ships the consumer source tree to the VM
# then invokes this command over SSH from {vm.workdir}. WinFsp + LLVM
# are prerequisites the user installs once via setup-windows-vm.ps1.
vm_build_command = "cargo build --release --features mount"

[ops]
# Host-side verify ops. Generic wrappers shipped by the harness under
# vendor/fs-test-harness/scripts/host/ — invoked with --binary {binary}
# and the image+path positionals. Image lives on host; no SSH needed.

[ops.verify-ls]
host = "host"
command = "bash vendor/fs-test-harness/scripts/host/verify-ls.sh --binary {binary} {image_dir}/{scenario.image} {step.path} {step.expect_args}"
expect_exit = 0

[ops.verify-cat]
host = "host"
command = "bash vendor/fs-test-harness/scripts/host/verify-cat.sh --binary {binary} {image_dir}/{scenario.image} {step.path} {step.expect_args}"
expect_exit = 0

[ops.verify-info]
host = "host"
command = "bash vendor/fs-test-harness/scripts/host/verify-info.sh --binary {binary} {image_dir}/{scenario.image} {step.expect_args}"
expect_exit = 0

# ============================================================
# Win-side (vm) ops
# ============================================================
#
# Each vm-side op script is SELF-CONTAINED: it mounts via -BinaryCmd,
# does the op, unmounts. Necessary because the v2 dispatcher uses one
# SSH session per step and user-mode mount processes (WinFsp + the
# xfs.exe binary) die when the spawning SSH session ends.
#
# XFS is read-only natively; no --rw flag, no rw_extra, no
# write/mkdir/rmdir/unlink/rename ops. The shared scripts under
# vendor/fs-test-harness/scripts/vm/ accept a {step.rw_flag?} which
# we leave unset — collapses to empty for our recipes.

[ops.win-cat-via-mount]
host = "vm"
command = "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '{vm.harness_root}/scripts/vm/win-cat-via-mount.ps1' -BinaryCmd '{vm.workdir}/target/release/xfs.exe mount {vm.workdir}/{scenario.image} --drive {step.drive}: {step.extra?}' -ReadyLine 'xfs mounted at' -Drive '{step.drive}' -Path '{step.path}' -ExpectContent '{step.expect_content?}' -ExpectSize '{step.expect_size?}' -ExpectSha256 '{step.expect_sha256?}'"
expect_exit = 0

[ops.win-ls-via-mount]
host = "vm"
command = "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '{vm.harness_root}/scripts/vm/win-ls-via-mount.ps1' -BinaryCmd '{vm.workdir}/target/release/xfs.exe mount {vm.workdir}/{scenario.image} --drive {step.drive}: {step.extra?}' -ReadyLine 'xfs mounted at' -Drive '{step.drive}' -Path '{step.path}' -ExpectNames '{step.expect_names_csv?}' -ExpectCount '{step.expect_count?}'"
expect_exit = 0
